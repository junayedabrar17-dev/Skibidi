            border: 1px solid var(--border);
            margin-bottom: 20px;

        }

            height: 14px;

            border: 1px solid var(--border);

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--done));
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .phase-banner {
            background: #1e293b;
            border-left: 4px solid var(--accent);
            padding: 12px 16px;
            margin: 24px 0 12px;
            border-radius: 6px;
            font-weight: 600;
            color: var(--accent);
        }
        .phase-banner.high { border-left-color: var(--high); color: #fda4af; }
        .phase-banner.rev { border-left-color: var(--done); color: #6ee7b7; }
        .day-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .day-card.completed { opacity: 0.6; border-color: var(--done); }
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .date-title { font-weight: 700; font-size: 1.05rem; }
        .tag {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tag-priority { background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.4); }
        .tag-remaining { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
        .tag-revision { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 0;
            cursor: pointer;
        }
        .task-item input[type="checkbox"] {
            margin-top: 4px;
            width: 17px;
            height: 17px;
            accent-color: var(--done);
            cursor: pointer;
        }
        .task-text { font-size: 0.95rem; }
        .task-item input:checked + .task-text {
            text-decoration: line-through;
            color: var(--muted);
        }
        .subj { font-weight: 600; color: var(--accent); }
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
        button {
            background: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        button:hover { background: #475569; }

            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--muted);

            background: var(--card);
            border-left: 4px solid var(--accent);

            margin: 22px 0 12px;
            border-radius: 6px;
            font-weight: 600;
            color: var(--accent);
        }

        .phase-banner.rev { border-left-color: var(--done); color: #6ee7b7; }
        .day-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .day-card.completed { opacity: 0.65; border-color: var(--done); }
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .date-title { font-weight: 700; font-size: 1rem; }
        .tag {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tag-priority { background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.4); }
        .tag-remaining { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
        .tag-revision { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 0;
            cursor: pointer;
        }
        .task-item input[type="checkbox"] {
            margin-top: 4px;
            width: 17px;
            height: 17px;
            accent-color: var(--done);
            cursor: pointer;
            flex-shrink: 0;
        }
        .task-text { font-size: 0.94rem; }
        .task-item input:checked + .task-text {
            text-decoration: line-through;
            color: var(--muted);
        }
        .subj { font-weight: 600; color: var(--accent); }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
        button {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 7px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
        }
